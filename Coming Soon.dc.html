    const day = Math.floor(diff/86400000); diff -= day*86400000;
    const hr = Math.floor(diff/3600000); diff -= hr*3600000;
    const mn = Math.floor(diff/60000); diff -= mn*60000;
    const sc = Math.floor(diff/1000);
    const p = (n) => String(n).padStart(2,'0');
    this.setState({ d:p(day), h:p(hr), m:p(mn), s:p(sc) });
  }

  ic(key, size, sw) {
    var P = {
      pen: '<path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path>',
      bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path>',
      handshake: '<path d="M11 17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-5l4-7h9l4 7v5a2 2 0 0 1-2 2h-2"></path><path d="M8 12h8"></path>',
      briefcase: '<rect x="2" y="7" width="20" height="14" rx="2"></rect><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"></path>',
      users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>',
      message: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>',
      flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line>',
      home: '<path d="M3 9.5 12 3l9 6.5"></path><path d="M5 10v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10"></path><path d="M9 21v-6h6v6"></path>',
      arrow: '<line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline>',
      rocket: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"></path><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path>'
    };
    return React.createElement('svg', { width:size||16, height:size||16, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:sw||1.7, strokeLinecap:'round', strokeLinejoin:'round', dangerouslySetInnerHTML:{ __html:P[key]||'' } });
  }

  initBg() {
    const cv = document.getElementById('cs-bg'); if (!cv) return;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    const ctx = cv.getContext('2d');
    let w, h, dpr = Math.min(window.devicePixelRatio || 1, 2), nodes = [];
    const COUNT = window.innerWidth < 768 ? 24 : 48;
    const resize = () => { w = innerWidth; h = innerHeight; cv.width = w*dpr; cv.height = h*dpr; cv.style.width = w+'px'; cv.style.height = h+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); };
    const seed = () => { nodes = Array.from({length:COUNT}, () => ({ x:Math.random()*innerWidth, y:Math.random()*innerHeight, vx:(Math.random()-.5)*.26, vy:(Math.random()-.5)*.26 })); };
    this._resize = () => resize();
    resize(); seed();
    window.addEventListener('resize', this._resize);
    if (reduce) { ctx.clearRect(0,0,w,h); return; }
    const loop = () => {
      ctx.clearRect(0,0,w,h);
      for (const p of nodes) { p.x += p.vx; p.y += p.vy; if (p.x<0||p.x>w) p.vx*=-1; if (p.y<0||p.y>h) p.vy*=-1; }
      for (let i=0;i<nodes.length;i++){
        for (let j=i+1;j<nodes.length;j++){
          const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y, d=Math.hypot(dx,dy);
          if (d<138){ ctx.strokeStyle=`rgba(47,123,255,${(1-d/138)*0.12})`; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(nodes[i].x,nodes[i].y); ctx.lineTo(nodes[j].x,nodes[j].y); ctx.stroke(); }
        }
        ctx.fillStyle='rgba(47,123,255,0.3)'; ctx.beginPath(); ctx.arc(nodes[i].x,nodes[i].y,1.6,0,7); ctx.fill();
      }
      this._raf = requestAnimationFrame(loop);
    };
    loop();
  }

  renderVals() {
    const p = this.props;
    return {
      activeKey: p.active || 'Resources',
      pageTitle: p.page || 'This page',
      kicker: p.kicker || 'RESOURCES',
      preview: p.preview || 'Something new is on the way. Check back shortly.',
      ctaHref: p.ctaHref || 'contact',
      ctaLabel: p.ctaLabel || 'Contact us',
      iconLg: this.ic(p.icon || 'sparkles', 34, 1.7),
      icHome: this.ic('home', 17, 1.9),
      icArrow: this.ic('arrow', 16, 2),
      icRocket: this.ic('rocket', 15, 1.8),
      countUnits: [
        { v:this.state.d, l:'Days' },
        { v:this.state.h, l:'Hours' },
        { v:this.state.m, l:'Minutes' },
        { v:this.state.s, l:'Seconds' }
      ]
    };
  }
}
