      <span style="font-size:11.5px;color:#8a97ab;overflow:hidden;text-overflow:ellipsis">{{ activeMeta }}</span>
    </span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:470,&quot;height&quot;:470},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{n:string,title:string,meta:string}[]&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;onPick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i:number)=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const items = this.props.items || [];
    const active = this.props.active || 0;
    const onPick = this.props.onPick || (() => {});
    const R = 168;
    const mk = (i) => {
      const rel = ((i - active) + 3) % 3;
      const ang = (-90 + rel * 120) * Math.PI / 180;
      const x = Math.cos(ang) * R;
      const y = Math.sin(ang) * R * 0.9;
      const isA = rel === 0;
      return {
        tf: 'translate(-50%,-50%) translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px) scale(' + (isA ? 1.16 : 0.86) + ')',
        z: isA ? 7 : 4,
        op: isA ? 1 : 0.7,
        glow: isA ? '0 22px 44px rgba(47,123,255,.34)' : '0 12px 26px rgba(10,17,36,.14)',
        pick: () => onPick(i)
      };
    };
    const cur = items[active] || {};
    return {
      o0: mk(0), o1: mk(1), o2: mk(2),
      activeNum: cur.n || '01',
      activeTitle: cur.title || 'Event loading',
      activeMeta: cur.meta || 'Dates coming soon'
    };
  }
}
</script>
</body>
