        <form onSubmit="{{ onSubmit }}">
          <div style="margin-bottom:15px"><label style="display:block;font-size:12.5px;font-weight:600;color:#475569;margin-bottom:7px">Email or username</label><input required type="text" placeholder="you@email.com" style="width:100%;padding:13px 15px;border-radius:12px;border:1px solid #DCE3EC;background:#fff;font-family:inherit;font-size:14px;color:#0A1124;outline:none;transition:border-color .2s,box-shadow .2s" style-focus="border-color:#2F7BFF;box-shadow:0 0 0 3px rgba(47,123,255,.14)" /></div>
          <div style="margin-bottom:10px"><label style="display:block;font-size:12.5px;font-weight:600;color:#475569;margin-bottom:7px">Password</label><input required type="password" placeholder="••••••••" style="width:100%;padding:13px 15px;border-radius:12px;border:1px solid #DCE3EC;background:#fff;font-family:inherit;font-size:14px;color:#0A1124;outline:none;transition:border-color .2s,box-shadow .2s" style-focus="border-color:#2F7BFF;box-shadow:0 0 0 3px rgba(47,123,255,.14)" /></div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;font-size:12.5px">
            <label style="display:flex;align-items:center;gap:8px;color:#475569;cursor:pointer"><input type="checkbox" style="width:15px;height:15px;accent-color:#2F7BFF;cursor:pointer" />Remember me</label>
            <a href="#" style="color:#2F7BFF;text-decoration:none;font-weight:600">Forgot password?</a>
          </div>
          <button type="submit" data-magnetic style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:14px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--g1),var(--g3));color:#fff;font-family:inherit;font-weight:600;font-size:15.5px;box-shadow:0 14px 30px rgba(47,123,255,.32);transition:transform .25s" style-hover="transform:translateY(-3px)">Sign in as {{ roleLabel }} →</button>
        </form>

        <sc-if value="{{ signedIn }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:16px;padding:13px 16px;border-radius:12px;background:#EEF6FF;border:1px solid #CFE3FF;font-size:13px;color:#1d4ed8;display:flex;align-items:center;gap:10px"><span style="width:20px;height:20px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g3));display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px">✓</span>Demo only, the {{ roleLabel }} portal isn't wired up yet.</div>
        </sc-if>

        <div style="margin-top:24px;padding-top:20px;border-top:1px solid #EEF2F7;text-align:center;font-size:13.5px;color:#64748b">New to Cybernaut? <a href="programs" style="color:#2F7BFF;text-decoration:none;font-weight:600">Explore programs →</a></div>
      </div>
    </div>
  </section>

  </div>

  <!-- FOOTER -->
  <dc-import name="Footer" hint-size="100%,600px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { menuOpen: false, mega: null, filter: 'all', openFaq: 0 };

  componentDidMount() {
    this.initBg(); this.initReveal(); this.initCounters();  this.initCursor();
  }
  componentWillUnmount() {
    cancelAnimationFrame(this._bgRaf); cancelAnimationFrame(this._craf);
    window.removeEventListener('resize', this._bgResize);
    window.removeEventListener('mousemove', this._bgMove);
    window.removeEventListener('mousemove', this._onCursor);
    window.removeEventListener('scroll', this._onScroll);
    window.removeEventListener('mousedown', this._onDown);
    window.removeEventListener('mouseup', this._onUp);
    window.removeEventListener('click', this._onClick);
    clearTimeout(this._revealFailsafe);
  }

  initBg() {
    const cv = document.getElementById('cn-bg'); if (!cv) return;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    const ctx = cv.getContext('2d');
    let w, h, dpr = Math.min(window.devicePixelRatio || 1, 2), nodes = [];
    const mouse = { x: -9999, y: -9999 };
    const COUNT = window.innerWidth < 768 ? 26 : 52;
    const resize = () => { w = innerWidth; h = innerHeight; cv.width = w*dpr; cv.height = h*dpr; cv.style.width = w+'px'; cv.style.height = h+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); };
    const seed = () => { nodes = Array.from({length:COUNT}, () => ({ x:Math.random()*innerWidth, y:Math.random()*innerHeight, vx:(Math.random()-.5)*.26, vy:(Math.random()-.5)*.26 })); };
    this._bgResize = () => resize();
    resize(); seed();
    window.addEventListener('resize', this._bgResize);
    this._bgMove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };
    window.addEventListener('mousemove', this._bgMove, { passive:true });
    if (reduce) { ctx.clearRect(0,0,w,h); return; }
    const loop = () => {
      ctx.clearRect(0,0,w,h);
      for (const p of nodes) {
        p.x += p.vx; p.y += p.vy;
        if (p.x<0||p.x>w) p.vx*=-1; if (p.y<0||p.y>h) p.vy*=-1;
        const mdx = mouse.x-p.x, mdy = mouse.y-p.y, md = Math.hypot(mdx,mdy);
        if (md<180){ p.x += mdx*0.0009*(1-md/180); p.y += mdy*0.0009*(1-md/180); }
      }
      for (let i=0;i<nodes.length;i++){
        for (let j=i+1;j<nodes.length;j++){
          const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y, d=Math.hypot(dx,dy);
          if (d<138){ ctx.strokeStyle=`rgba(47,123,255,${(1-d/138)*0.13})`; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(nodes[i].x,nodes[i].y); ctx.lineTo(nodes[j].x,nodes[j].y); ctx.stroke(); }
        }
        ctx.fillStyle='rgba(47,123,255,0.32)'; ctx.beginPath(); ctx.arc(nodes[i].x,nodes[i].y,1.7,0,7); ctx.fill();
      }
      this._bgRaf = requestAnimationFrame(loop);
    };
    loop();
  }

  initReveal() {
    const els = Array.from(document.querySelectorAll('[data-reveal]'));
    if (!('IntersectionObserver' in window)) return;
    const vh = innerHeight;
    els.forEach(el => { const r = el.getBoundingClientRect(); if (r.top < vh*0.9 && r.bottom>0) el.classList.add('cn-in'); else el.classList.add('cn-pre'); });
    const io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting){ e.target.classList.remove('cn-pre'); e.target.classList.add('cn-in'); io.unobserve(e.target); } }), { threshold:0.12, rootMargin:'0px 0px -8% 0px' });
    els.forEach(el => { if (el.classList.contains('cn-pre')) io.observe(el); });
    this._revealFailsafe = setTimeout(() => els.forEach(el => { el.classList.remove('cn-pre'); el.classList.add('cn-in'); }), 4000);
  }

  runCounter(el) {
    const target = parseFloat(el.getAttribute('data-target'));
    const dec = parseInt(el.getAttribute('data-decimals')||'0');
    const dur = 1600, t0 = performance.now();
    const step = (now) => {
      const p = Math.min((now-t0)/dur,1), eased = 1-Math.pow(1-p,3), val = target*eased;
      el.textContent = dec ? val.toFixed(dec) : Math.floor(val).toLocaleString('en-IN');
      if (p<1) requestAnimationFrame(step); else el.textContent = dec ? target.toFixed(dec) : target.toLocaleString('en-IN');
    };
    requestAnimationFrame(step);
  }
  initCounters() {
    const fire = (el) => { if (el._done) return; el._done = true; this.runCounter(el); };
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting){ fire(e.target); io.unobserve(e.target);} }), { threshold:0.3 });
      setTimeout(() => { const vh = innerHeight; document.querySelectorAll('[data-count]').forEach(el => { const r = el.getBoundingClientRect(); if (r.top < vh && r.bottom > 0) fire(el); else io.observe(el); }); }, 100);
      setTimeout(() => document.querySelectorAll('[data-count]').forEach(fire), 2600);
    } else { document.querySelectorAll('[data-count]').forEach(fire); }
  }

  initNavScroll() {
    if (window.__cnNavThemeInit) return;   // navbar-theme.js is the single owner of nav scroll styling
    let ticking = false, scrolled = null;
    const apply = () => {
      ticking = false;
      const el = document.querySelector('nav'); if (!el) return;
      const now = window.scrollY > 30;
      if (now === scrolled) return; scrolled = now;
      const lg = document.querySelector('[data-logo]');
      if (now) { el.style.background='#ffffff'; el.style.backdropFilter='blur(16px)'; el.style.borderBottom='1px solid #E6ECF3'; el.style.padding='7px 0'; if(lg){lg.style.height='40px';lg.src='cybernaut-logo.webp';} }
      else { el.style.background='transparent'; el.style.backdropFilter='none'; el.style.borderBottom='1px solid transparent'; el.style.padding='9px 0'; if(lg){if(window.__cnHeroDark===undefined){window.__cnHeroDark=(function(){var nv=document.querySelector('nav');if(!nv)return false;var r=nv.getBoundingClientRect();var st=document.elementsFromPoint(window.innerWidth/2,r.bottom+14)||[];function lumStr(s){var cols=[],idx=0;while((idx=s.indexOf('#',idx))!==-1){var hex=s.substr(idx+1,6);if(/^[0-9a-fA-F]{6}$/.test(hex)){cols.push([parseInt(hex.substr(0,2),16),parseInt(hex.substr(2,2),16),parseInt(hex.substr(4,2),16)]);}idx++;}idx=0;while((idx=s.indexOf('rgb',idx))!==-1){var op=s.indexOf('(',idx),cp=s.indexOf(')',op);if(op!==-1&&cp!==-1){var q=s.slice(op+1,cp).split(',').map(parseFloat);if(q.length>=3)cols.push([q[0],q[1],q[2]]);}idx=cp===-1?idx+3:cp+1;}if(!cols.length)return null;var L=0;for(var k=0;k<cols.length;k++){L+=(0.299*cols[k][0]+0.587*cols[k][1]+0.114*cols[k][2])/255;}return L/cols.length;}for(var i=0;i<st.length;i++){var nd=st[i];if(nv.contains(nd))continue;var c=nd;while(c&&c!==document.documentElement){var cs=getComputedStyle(c);var bg=cs.backgroundColor;if(bg&&bg.slice(0,3)==='rgb'){var p=bg.replace(/[^0-9.,]/g,'').split(',').map(parseFloat);var a=p.length>3?p[3]:1;if(a>0.5){return (0.299*p[0]+0.587*p[1]+0.114*p[2])/255<0.5;}}var bi=cs.backgroundImage;if(bi&&bi.indexOf('gradient')!==-1&&bi.indexOf('transparent')===-1){var GL=lumStr(bi);if(GL!==null)return GL<0.5;}c=c.parentElement;}}return false;})();}lg.style.height='48px';lg.src=(window.__cnHeroDark?'footer-logo.webp':'cybernaut-logo.webp');} }
    };
    this._onScroll = () => { if (!ticking){ ticking = true; requestAnimationFrame(apply); } };
    window.addEventListener('scroll', this._onScroll, { passive:true });
    apply();
  }

  initCursor() {
    if (!window.matchMedia || !window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
    const dot = document.getElementById('cn-dot'), ring = document.getElementById('cn-ring');
    if (!dot || !ring) return;
    dot.style.display = ring.style.display = 'block';
    let mx = innerWidth/2, my = innerHeight/2, rx = mx, ry = my;
    this._onCursor = (e) => {
      mx = e.clientX; my = e.clientY;
      dot.style.transform = `translate(${mx}px,${my}px)`;
      const t = e.target.closest('a,button,[data-magnetic]');
      if (t) { ring.style.width='58px'; ring.style.height='58px'; ring.style.margin='-29px 0 0 -29px'; ring.style.background='rgba(47,123,255,.1)';
        
      } else { ring.style.width='38px'; ring.style.height='38px'; ring.style.margin='-19px 0 0 -19px'; ring.style.background='transparent'; }
    };
    window.addEventListener('mousemove', this._onCursor, { passive:true });
    document.addEventListener('mouseout', (e) => { const t = e.target.closest && e.target.closest('a,button,[data-magnetic]'); if (t && t._mag){ t.style.transform=''; t._mag=false; } }, true);
    const lerp = () => { rx += (mx-rx)*0.18; ry += (my-ry)*0.18; ring.style.transform=`translate(${rx}px,${ry}px)`; this._craf = requestAnimationFrame(lerp); };
    lerp();
    this._onDown = () => { ring.style.borderColor='#1FD3E8'; };
    this._onUp = () => { ring.style.borderColor='#2F7BFF'; };
    this._onClick = (e) => { const rp = document.createElement('span'); rp.style.cssText='position:fixed;left:'+e.clientX+'px;top:'+e.clientY+'px;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;border:2px solid #2F7BFF;z-index:9998;pointer-events:none;animation:cnRipple .6s ease-out forwards'; document.body.appendChild(rp); setTimeout(()=>rp.remove(),620); };
    window.addEventListener('mousedown', this._onDown, { passive:true });
    window.addEventListener('mouseup', this._onUp, { passive:true });
    window.addEventListener('click', this._onClick, { passive:true });
  }

  navData() {
    const navDefs = [
      { label:'Home', href:'./#hero' },
      { label:'Programs We Offer', href:'programs', mega:'programs' },
      { label:'Cybernaut SaaS', href:'saas' },
      { label:'Events', href:'events' },
      { label:'About Company', href:'about' },
      { label:'Blogs', href:'blogs' },
      { label:'Careers', href:'careers' },
      { label:'Contact Us', href:'contact' }
    ];
    const navLinks = navDefs.map(n => ({ label:n.label, href:n.href }));
    const navItems = navDefs.map(n => ({
      label:n.label, href:n.href, title:'',
      caret: !!n.mega, color: n.active ? '#2F7BFF' : '#475569',
      underline: ((this.state.mega && this.state.mega === n.mega) || n.active) ? 1 : 0,
      onEnter: () => this.setState({ mega: n.mega || null })
    }));
    const leftNav = navItems.filter(n => ['Programs We Offer','Cybernaut SaaS','Events'].includes(n.label));
    const rightNav = navItems.filter(n => ['About Company','Blogs','Careers','Contact Us'].includes(n.label));
    const megaStudents = [
      { ic:'F', name:'Foundation Programs', desc:'Tech Trio · Programming basics', href:'programs/students#foundation' },
      { ic:'P', name:'Professional Programs', desc:'Job-ready career tracks', href:'programs/students#professional' },
      { ic:'S', name:'All Student Programs', desc:'Browse the full catalogue', href:'programs/students' }
    ];
    const megaCollege = [
      { ic:'V', name:'VAC Programs', desc:'Value-added courses', href:'programs/colleges#vac' },
      { ic:'G', name:'Generative AI', desc:'Campus VAC', href:'programs/colleges/generative-ai' },
      { ic:'R', name:'Placement Training', desc:'1 / 2 / 4-year tracks', href:'programs/colleges#placement' },
      { ic:'M', name:'Partner With Us', desc:'MOUs & outreach', href:'contact' }
    ];
    const footExplore = [
      { label:'Programs We Offer', href:'programs' },
      { label:'Cybernaut SaaS', href:'saas' },
      { label:'Events', href:'events' },
      { label:'Blogs', href:'blogs' },
      { label:'Careers', href:'careers' }
    ];
    const footCompany = [
      { label:'About Company', href:'about' },
      { label:'Student Login', href:'login' },
      { label:'Contact Us', href:'contact' },
      { label:'Terms & Conditions', href:'coming-soon' },
      { label:'Privacy Policy', href:'coming-soon' },
      { label:'Refund Policy', href:'coming-soon' }
    ];
    const socials = [
      { name:'Instagram', ic:'IG', href:'#' }, { name:'LinkedIn', ic:'in', href:'#' },
      { name:'YouTube', ic:'YT', href:'#' }, { name:'WhatsApp', ic:'WA', href:'#' }, { name:'X', ic:'X', href:'#' }
    ];
    return {
      leftNav, rightNav, navLinks, megaStudents, megaCollege, footExplore, footCompany, socials,
      megaPrograms: this.state.mega === 'programs',
      closeMega: () => this.setState({ mega: null }),
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false })
    };
  }

  pageData() {
    const perks = ['Track your course progress','Practice, contests & playground','Your community & mentor connect'];
    const sel = this.state.role || 'student';
    const defs = [
      { key:'student', ic:'S', label:'Student' },
      { key:'college', ic:'C', label:'College' },
      { key:'business', ic:'B', label:'Business' }
    ];
    const roles = defs.map(d => {
      const on = sel === d.key;
      return {
        ic:d.ic, label:d.label,
        bg: on ? 'linear-gradient(135deg,rgba(47,123,255,.1),rgba(31,211,232,.08))' : '#fff',
        border: on ? '#2F7BFF' : '#E6ECF3',
        iconBg: on ? 'linear-gradient(135deg,var(--g1),var(--g3))' : '#F2F6FC',
        iconColor: on ? '#fff' : '#94a3b8',
        labelColor: on ? '#0A1124' : '#64748b',
        onSelect: () => this.setState({ role: d.key, signedIn: false })
      };
    });
    const roleLabel = (defs.find(d => d.key === sel) || defs[0]).label;
    return {
      perks, roles, roleLabel,
      signedIn: !!this.state.signedIn,
      onSubmit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ signedIn: true }); }
    };
  }

    renderVals() {
    return { ...this.navData(), ...this.pageData() };
  }
}
</script>
